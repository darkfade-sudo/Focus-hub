<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Budget Buddy</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header">
<h1>Budget Buddy</h1>
<div class="month-picker-container">
<input type="month" id="monthPicker">
</div>
</header>
<main class="container">
<section class="summary-section">
<div class="card">
<h2>Income</h2>
<span id="totalIncome">0.00</span>
</div>
<div class="card">
<h2>Expenses</h2>
<span id="totalExpenses">0.00</span>
</div>
<div class="card">
<h2>Balance</h2>
<span id="balance">0.00</span>
</div>
</section>
<section class="form-section">
<h2>Add Transaction</h2>
<form id="txForm">
<div class="form-group">
<label for="txType">Type</label>
<select id="txType">
<option value="income">Income</option>
<option value="expense">Expense</option>
</select>
</div>
<div class="form-group">
<label for="txAmount">Amount</label>
<input type="number" id="txAmount" step="0.01" required>
</div>
<div class="form-group">
<label for="txCategory">Category</label>
<select id="txCategory">
<option value="Food">Food</option>
<option value="Transport">Transport</option>
<option value="Rent">Rent</option>
<option value="Fun">Fun</option>
<option value="Health">Health</option>
<option value="Salary">Salary</option>
<option value="Other">Other</option>
</select>
</div>
<div class="form-group">
<label for="txDate">Date</label>
<input type="date" id="txDate" required>
</div>
<div class="form-group">
<label for="txNote">Note</label>
<input type="text" id="txNote">
</div>
<button class="btn" type="submit">Add Transaction</button>
</form>
</section>
<section class="filter-section">
<div class="form-group">
<input type="text" id="searchBox" placeholder="Search transactions...">
</div>
<div class="form-group">
<select id="filterCategory">
<option value="All">All Categories</option>
<option value="Food">Food</option>
<option value="Transport">Transport</option>
<option value="Rent">Rent</option>
<option value="Fun">Fun</option>
<option value="Health">Health</option>
<option value="Salary">Salary</option>
<option value="Other">Other</option>
</select>
</div>
</section>
<section class="list-section">
<h2>Transactions</h2>
<div id="txList"></div>
</section>
<section class="chart-section">
<h2>Expense Breakdown</h2>
<canvas id="chart" width="600" height="300"></canvas>
</section>
<section class="budget-section">
<h2>Category Budgets</h2>
<form id="budgetForm">
<div class="form-group">
<label for="budgetCategory">Category</label>
<select id="budgetCategory">
<option value="Food">Food</option>
<option value="Transport">Transport</option>
<option value="Rent">Rent</option>
<option value="Fun">Fun</option>
<option value="Health">Health</option>
<option value="Other">Other</option>
</select>
</div>
<div class="form-group">
<label for="budgetLimit">Monthly Limit</label>
<input type="number" id="budgetLimit" step="0.01" required>
</div>
<button class="btn" type="submit">Set Budget</button>
</form>
<div id="budgetList"></div>
</section>
<section class="export-section">
<button id="exportBtn" class="btn">Export CSV</button>
</section>
</main>
<script src="app.js"></script>
</body>
</html>
